[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web_scraper_pipelines"
version = "0.0.1"
description = "LLM-based pipelines for work in web"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "h128bit"}
]
urls = {Homepage = "https://gitlab.fcpriirf.ru/t.asmus/linguistic_pipelines"}
keywords = ["llm", "agents", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "websearchagent @ git+http://gitlab.fgau.local/t.asmus/websearchagent.git",
    "crawl4ai",
    "playwright",
    "pydantic",
    "peewee",
    "python-dotenv",
    "psycopg2-binary",
    "beautifulsoup4" 
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["docs*", "tests*"]
